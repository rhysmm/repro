<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Repro — cursor capture test</title><style>
*{box-sizing:border-box}body{font:16px system-ui;margin:24px;background:#e9eef5;color:#253247}main{margin:0 auto;max-width:1000px}h1{font-size:24px}label{display:inline-flex;gap:8px;align-items:center;margin:0 20px 16px 0}#stage{height:500px;background:#fff;border:1px solid #cad4e2;border-radius:12px;padding:30px;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:70px 160px}button,input{font:inherit}button{border:1px solid #9eafc8;border-radius:8px;background:#edf3ff;padding:18px;cursor:pointer}button:hover{background:#d2e2ff}input[type=text]{width:100%;padding:14px;border:1px solid #9eafc8;border-radius:8px}#status{position:absolute;top:230px;left:30px;right:30px;text-align:center;color:#53647d}.hidden-cursor,.hidden-cursor *{cursor:none!important}.field{align-self:center}.field span{display:block;margin-bottom:8px}small{display:block;margin-top:12px;color:#53647d}
</style></head><body><main><h1>Cursor capture test</h1><label><input id="hide" type="checkbox">Hide page cursor with CSS</label><label><input id="rings" type="checkbox" disabled>Repro replacement pointer disabled in diagnostic mode</label><div id="stage" data-testid="cursor-stage"><button id="a">Top left</button><button id="b">Top right</button><p id="status" role="status">Click a target, then move to another.</p><button id="c">Bottom left</button><div class="field"><span>Text field</span><input id="text" aria-label="Text field" type="text" placeholder="Type here"></div></div><small>Local test only. CSS hiding affects the live page cursor; turning the checkbox off restores it.</small></main><script>
const hide=document.getElementById('hide');hide.addEventListener('change',()=>document.documentElement.classList.toggle('hidden-cursor',hide.checked));document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.getElementById('status').textContent=`Clicked ${button.textContent}`;}));
</script></body></html>
