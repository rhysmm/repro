<!doctype html><html lang="en"><meta charset="utf-8"><title>Repro — test fixture</title><style>
body{font:16px system-ui;background:#e9eef5;color:#14233b;margin:0;padding:48px} main{max-width:920px;margin:auto} .panel{background:white;border-radius:18px;padding:32px;box-shadow:0 8px 30px #13233b12} h1{margin:0 0 12px} .tag{font-size:12px;letter-spacing:2px;color:#516887} button{font:inherit;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;background:#2859db;color:white;margin:8px 8px 8px 0} input{padding:12px;border:1px solid #bac5d5;border-radius:8px;font:inherit} .result{margin-top:20px;padding:20px;background:#f0f4fa;border-radius:10px;min-height:52px}.outside{margin-top:28px;color:#5a6c83}.caret{animation:blink 1s infinite}@keyframes blink{50%{opacity:0}} .row{display:flex;gap:24px;align-items:center}.count{font-size:36px;font-weight:700} .spacer{height:700px}
</style><main><p class="tag">REPRO · VALIDATION FIXTURE</p><section class="panel" data-testid="publish-dialog" role="dialog" aria-label="Publish post"><h1>Publish a post</h1><p>A deterministic fixture for recording clicks, changes, and idle gaps.</p><label>Post title <input aria-label="Post title" value="Autumn update"></label><div class="row"><div><button id="publish">Publish</button><button id="delay">Save slowly</button><button id="reset">Reset</button></div><span class="count" data-testid="count">0</span></div><div class="result" data-testid="result" role="status">Ready to publish <span class="caret">▏</span></div></section><p class="outside">This text should be excluded from panel crops.</p><button id="navigate">Navigate to another page</button><div class="spacer"></div><div data-testid="below-fold">Below-fold target</div></main><script>
let count=0; const result=document.querySelector('[data-testid=result]');
document.querySelector('#publish').onclick=()=>{count++;document.querySelector('[data-testid=count]').textContent=count;result.textContent='Published successfully · '+count;result.style.background='#dff4e7';};
document.querySelector('#delay').onclick=()=>{result.textContent='Saving…';result.style.background='#fff2ca';setTimeout(()=>{result.textContent='Saved after 5 seconds';result.style.background='#dff4e7';},5000);};
document.querySelector('#reset').onclick=()=>{count=0;document.querySelector('[data-testid=count]').textContent=0;result.innerHTML='Ready to publish <span class="caret">▏</span>';result.style.background='#f0f4fa';};
document.querySelector('#navigate').onclick=()=>location.href='/demo?second=1';
</script></html>
